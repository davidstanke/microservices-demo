name: Vertex AI Issue Agent

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  query-agent:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'issues' ||
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/assignment-feedback'))
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Prepare Payload and Query Vertex AI
        id: query
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            # Strip prefix "/assignment-feedback"
            FEEDBACK_CONTENT="${COMMENT_BODY#"/assignment-feedback"}"
            
            # Format query exactly as requested
            QUERY=$(printf "FEEDBACK: %s\n-----\nIssue details:\n%s\n%s" "$FEEDBACK_CONTENT" "$ISSUE_TITLE" "$ISSUE_BODY")
          else
            # Combine title and body safely for initial assignment
            QUERY=$(printf "%s\n\n%s" "$ISSUE_TITLE" "$ISSUE_BODY")
          fi
          
          # Use jq to construct a safe JSON payload
          jq -n --arg query "$QUERY" '{input: {query: $query, user_id: "issue-triage-client"}}' > payload.json
          
          # Get access token locally using gcloud (no extra IAM permissions needed)
          ACCESS_TOKEN=$(gcloud auth print-access-token)

          # Query the Vertex AI Reasoning Engine endpoint
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d @payload.json \
            "https://us-east1-aiplatform.googleapis.com/v1/projects/620915686749/locations/us-east1/reasoningEngines/5714117949086760960:query")
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "API request failed with status $HTTP_STATUS"
            cat response.json
            exit 1
          fi
          
          # Verify .output exists and is not null/empty
          OUTPUT_VAL=$(jq -r '.output' response.json)
          if [ "$OUTPUT_VAL" = "null" ] || [ -z "$OUTPUT_VAL" ]; then
            echo "Failed to extract output. Response was:"
            cat response.json
            exit 1
          fi

      - name: Assign and Comment on Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Extract assigned_engineer and explanation
          # We use a robust jq query to handle .output being either a JSON object or JSON string
          ASSIGNEE=$(jq -r '.output | if type == "string" then fromjson else . end | .assigned_engineer' response.json)
          EXPLANATION=$(jq -r '.output | if type == "string" then fromjson else . end | .explanation' response.json)

          if [ "$ASSIGNEE" = "null" ] || [ -z "$ASSIGNEE" ]; then
            echo "Failed to extract assigned_engineer. Response was:"
            cat response.json
            exit 1
          fi

          # Retrieve current assignees to unassign them before adding the new assignee
          CURRENT_ASSIGNEES=$(gh issue view "$ISSUE_URL" --json assignees --jq '[.assignees[].login] | join(",")')

          if [ -n "$CURRENT_ASSIGNEES" ]; then
            echo "Removing existing assignees: $CURRENT_ASSIGNEES"
            if ! gh issue edit "$ISSUE_URL" --remove-assignee "$CURRENT_ASSIGNEES"; then
              echo "::warning::Failed to remove existing assignees."
            fi
          fi

          # Attempt to assign the issue
          ASSIGN_FAILED=false
          echo "Attempting to assign issue to $ASSIGNEE..."
          if ! gh issue edit "$ISSUE_URL" --add-assignee "$ASSIGNEE"; then
            echo "::warning::Failed to assign $ASSIGNEE to the issue."
            ASSIGN_FAILED=true
          fi

          # Prepare comment body based on event type
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            # Post the returned message (explanation) directly as a new comment on the issue
            echo "$EXPLANATION" > comment.txt
          else
            # Default behavior for initial assignment
            if [ "$ASSIGN_FAILED" = "false" ]; then
              echo "Assigned to $ASSIGNEE. Reason: $EXPLANATION" > comment.txt
            else
              echo "Attempted to assign to $ASSIGNEE, but assignment failed (e.g. user is not a collaborator). Reason: $EXPLANATION" > comment.txt
            fi
          fi

          # Post comment to issue
          gh issue comment "$ISSUE_URL" --body-file comment.txt
